name: Notify Slack of Package Changes

permissions:
  contents: read
  pull-requests: read

on:
  pull_request_target:
    types: [closed]
    branches: [main]
    paths:
      - 'packages/**'

jobs:
  notify:
    name: Notify Slack of Package Changes
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Classify package changes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          trap 'echo "Classify changes failed at line ${LINENO}: ${BASH_COMMAND}" >&2' ERR

          changed_files="$(
            gh api --paginate "repos/${REPOSITORY}/pulls/${PR_NUMBER}/files" \
              --jq '.[].filename'
          )"

          has_packages=false
          changed_packages=""
          package_manifests="$(find packages -name package.json -not -path '*/node_modules/*' -print | sort)"

          add_package() {
            local package="$1"

            if ! grep --fixed-strings --line-regexp --quiet "$package" <<< "$changed_packages"; then
              changed_packages="${changed_packages}${package}"$'\n'
            fi
          }

          package_name_for_file() {
            local file="$1"
            local best_name=""
            local best_path=""
            local manifest package_name package_path

            while IFS= read -r manifest; do
              [ -n "$manifest" ] || continue

              package_path="${manifest%/package.json}"
              case "$file" in
                "$package_path" | "$package_path"/*)
                  if [ ${#package_path} -gt ${#best_path} ]; then
                    package_name="$(jq -r '.name // empty' "$manifest")"

                    if [ -n "$package_name" ]; then
                      best_name="$package_name"
                      best_path="$package_path"
                    fi
                  fi
                  ;;
              esac
            done <<< "$package_manifests"

            if [ -n "$best_name" ]; then
              printf '%s\n' "$best_name"
            fi
          }

          while IFS= read -r file; do
            case "$file" in
              packages/*)
                has_packages=true

                package_name="$(package_name_for_file "$file")"
                if [ -n "$package_name" ]; then
                  add_package "$package_name"
                fi
                ;;
            esac
          done <<< "$changed_files"

          if [ "$has_packages" != "true" ]; then
            echo "notify=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          package_list="$(
            printf '%s' "$changed_packages" \
              | sed '/^$/d' \
              | awk '{ print "• `" $0 "`" }'
          )"

          {
            echo "notify=true"
            echo "package_list<<EOF"
            echo "$package_list"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Slack
        if: steps.changes.outputs.notify == 'true'
        env:
          CHANGED_PACKAGES: ${{ steps.changes.outputs.package_list }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login || github.actor }}
          MESSAGE_BODY: Package updates were merged.
          MESSAGE_TITLE: 📦 Package changes just landed
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          set -euo pipefail

          payload="$(
            jq -n \
              --arg message_title "$MESSAGE_TITLE" \
              --arg message_body "$MESSAGE_BODY" \
              --arg changed_packages "$CHANGED_PACKAGES" \
              --arg merged_by "$MERGED_BY" \
              --arg pr_number "#${PR_NUMBER}" \
              --arg pr_title "$PR_TITLE" \
              --arg pr_url "$PR_URL" \
              '{
                text: "\($message_title): \($pr_title)",
                blocks: ([
                    {
                      type: "section",
                      text: {
                        type: "mrkdwn",
                        text: "*\($message_title)*\n\($message_body)"
                      }
                    },
                    {
                      type: "section",
                      fields: [
                        {
                          type: "mrkdwn",
                          text: "*Pull request:*\n<\($pr_url)|\($pr_number)> \($pr_title)"
                        },
                        {
                          type: "mrkdwn",
                          text: "*Merged by:*\n\($merged_by)"
                        }
                      ]
                    }
                  ] + (
                  if $changed_packages == "" then
                    []
                  else
                    [
                      {
                        type: "section",
                        text: {
                          type: "mrkdwn",
                          text: "*Changed packages:*\n\($changed_packages)"
                        }
                      }
                    ]
                  end
                ))
              }'
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
