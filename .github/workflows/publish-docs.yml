# Simple workflow for deploying static content to GitHub Pages
name: Deploy Documentation to GitHub Pages

on:
  # Runs when a grouped Release Please commit reaches the default branch
  push:
    branches: ['main']
    paths: ['.release-please-manifest.json']

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions: {}

jobs:
  deploy:
    name: Deploy Documentation to GitHub Pages
    permissions:
      contents: read
      deployments: read
      pages: write
      id-token: write
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and
    # latest queued. Do not cancel in-progress production deployments.
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      comparison_url: ${{ steps.previous_deployment.outputs.result }}
      page_url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
      - run: pnpm i --prefer-offline --frozen-lockfile
      - run: pnpm docs:generate
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Upload docs
          path: './docs'
      - name: Find previous successful Pages deployment
        continue-on-error: true
        id: previous_deployment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CURRENT_SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        with:
          github-token: ${{ github.token }}
          result-encoding: string
          script: |
            const { owner, repo } = context.repo
            const currentSha = process.env.CURRENT_SHA

            const { data: deployments } = await github.rest.repos.listDeployments({
              owner,
              repo,
              environment: 'github-pages',
              per_page: 2,
            })
            // Declaring the job environment creates the current deployment before this step runs.
            const [currentDeployment, previousDeployment] = deployments

            if (currentDeployment === undefined || currentDeployment.sha !== currentSha) {
              return ''
            }

            if (previousDeployment === undefined || previousDeployment.sha === currentSha) {
              return ''
            }

            const { data: statuses } = await github.rest.repos.listDeploymentStatuses({
              owner,
              repo,
              deployment_id: previousDeployment.id,
              per_page: 10,
            })

            if (!statuses.some((status) => status.state === 'success')) {
              return ''
            }

            return `${process.env.SERVER_URL}/${owner}/${repo}/compare/${previousDeployment.sha}...${currentSha}`
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  notify:
    name: Notify Slack of Published Documentation
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Notify Slack
        env:
          COMPARISON_URL: ${{ needs.deploy.outputs.comparison_url }}
          DOCUMENTATION_URL: ${{ needs.deploy.outputs.page_url }}
          SLACK_TECH_WRITER_ID: ${{ secrets.SLACK_TECH_WRITER_ID }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          if [ -z "$SLACK_TECH_WRITER_ID" ]; then
            echo "SLACK_TECH_WRITER_ID is required for documentation notifications." >&2
            exit 1
          fi

          message_body="<@${SLACK_TECH_WRITER_ID}>, the latest Optimization SDK documentation is now live."
          source_short_sha="${SOURCE_SHA:0:7}"

          payload="$(
            jq -n \
              --arg comparison_url "$COMPARISON_URL" \
              --arg documentation_url "$DOCUMENTATION_URL" \
              --arg message_body "$message_body" \
              --arg source_short_sha "$source_short_sha" \
              --arg source_url "$SOURCE_URL" \
              --arg workflow_url "$WORKFLOW_URL" \
              '{
                text: "Documentation published: \($documentation_url)",
                blocks: [
                  {
                    type: "section",
                    text: {
                      type: "mrkdwn",
                      text: "*📝 Documentation published*\n\($message_body)"
                    }
                  },
                  {
                    type: "section",
                    fields: (
                      [
                        {
                          type: "mrkdwn",
                          text: "*Documentation:*\n<\($documentation_url)|View published documentation>"
                        },
                        {
                          type: "mrkdwn",
                          text: "*Source:*\n<\($source_url)|\($source_short_sha)>"
                        }
                      ] +
                      (
                        if $comparison_url == "" then
                          []
                        else
                          [
                            {
                              type: "mrkdwn",
                              text: "*Changes:*\n<\($comparison_url)|Compare with previous publication>"
                            }
                          ]
                        end
                      )
                    )
                  },
                  {
                    type: "context",
                    elements: [
                      {
                        type: "mrkdwn",
                        text: "<\($workflow_url)|View deployment workflow>"
                      }
                    ]
                  }
                ]
              }'
          )"

          curl --fail-with-body --silent --show-error \
            --request POST \
            --header 'Content-type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
