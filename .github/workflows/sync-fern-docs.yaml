# Publishes the authored Optimization SDK documentation to contentful/contentful-docs as a pull
# request. Layer 3 of the sync: a thin shell around `pnpm docs:fern` and `pnpm docs:fern:apply`, both
# of which run locally without credentials (see documentation/AGENTS.md).
#
# Write access to contentful-docs is a short-lived `contentful-cross-repository` GitHub App token
# minted by Vault, scoped to that one repository by immutable ID (`contents: write`,
# `pull_requests: write`). The grant is target-owned: contentful-docs lists this repository under
# `cross-repository-write.sources` in its own `.contentful/vault-secrets.yaml`, so nothing here can
# widen it and no long-lived token is stored here.
#
# This talks to Vault directly rather than through the `cross-repository-write` preset in
# contentful/vault-github-actions. That action lives in an internal repository and this repository is
# public, so the runner cannot resolve it — the failure is `Unable to resolve action …, not found`.
# The role names, secret path, and bot identity below are the preset's, so the trust model is
# identical; only the caller differs. Keep them in step with that repository.
#
# The role depends on the triggering event, and both triggers deliver a pull request:
#   * release published  — role `…-release`, bound to a tag
#   * workflow_dispatch  — role `…-workflow-dispatch`, bound to the default branch
#
# The dispatch role's subject is pinned to this repository's default branch, so a manual run must be
# launched from `main`. That is not a limit on what can be published: launch from `main` and pass
# `ref` to export any other tree. A dispatch launched from a feature branch fails Vault
# authentication, which is why the input describes the ref rather than the launch branch.
#
# Merging the grouped release PR creates one GitHub release per component, so `on: release` fires
# several times for one release moment. Every component tag points at that one merge commit, so
# naming the branch after the exported commit makes those firings converge on one branch and one
# pull request. A later release exports a different commit and so gets its own branch, which is
# never force-pushed over a branch someone is reviewing and never outlives its own merge.
#
# contentful-docs conventions this must satisfy (see that repo's docs/ADRs and AGENTS.md):
#   * no `${{ }}` interpolation inside a `run:` block — bind to `env:` and reference "$VAR"
#   * third-party actions pinned to a full commit SHA
#   * every synced page needs a nav entry in the same commit, or check-orphan-pages.js fails
name: Sync Fern Docs

on:
  # Only `published` is usable: the preset requires `github.event.action == 'published'`, so adding
  # `created` or `released` here would produce runs that fail Vault authentication. release-please
  # creates these releases with its own token rather than the default one, which is what lets the
  # event start a workflow run at all.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: 'Ref to export documentation from (defaults to the branch this runs on)'
        required: false
        type: string
      draft:
        description: 'Open the pull request as a draft'
        required: false
        type: boolean
        default: true

# Never cancel in progress: a half-pushed branch is worse than a duplicate run, and re-running one
# commit is idempotent, so a queued run simply reproduces the same result.
concurrency:
  group: fern-docs-sync
  cancel-in-progress: false

permissions:
  contents: read
  # Required for the OIDC token that Vault exchanges for the scoped App token.
  id-token: write

env:
  DOCS_REPO: contentful/contentful-docs
  DOCS_DIR: contentful-docs
  SYNC_BRANCH_PREFIX: sync/optimization-docs

jobs:
  sync:
    name: 📤 Sync docs to contentful-docs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout optimization
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - run: pnpm install --prefer-offline --frozen-lockfile

      # Resolve the ref once so the export, the commit message, and the PR body all describe the same
      # thing. `inputs.ref` is empty on a release, in which case the checked-out tag is used.
      - name: Resolve export ref
        id: resolve
        env:
          INPUT_REF: ${{ inputs.ref }}
          FALLBACK_REF: ${{ github.ref_name }}
        run: |
          ref="$INPUT_REF"
          [ -z "$ref" ] && ref="$FALLBACK_REF"
          sha="$(git rev-parse --short HEAD)"
          printf 'ref=%s\n' "$ref" >>"$GITHUB_OUTPUT"
          printf 'sha=%s\n' "$sha" >>"$GITHUB_OUTPUT"
          # One branch per exported commit, not per firing. Merging the grouped release pull request
          # tags every component at the same commit, so all of those release events land on one
          # branch and one pull request without any of them rewriting another's.
          printf 'branch=%s-%s\n' "$SYNC_BRANCH_PREFIX" "$sha" >>"$GITHUB_OUTPUT"

      # Fails the run before anything is pushed if a link, anchor, slug, or MDX problem exists.
      - run: pnpm fern:check

      - name: Build the Fern bundle
        env:
          EXPORT_REF: ${{ steps.resolve.outputs.ref }}
        run: pnpm docs:fern -- --ref "$EXPORT_REF"

      # One Vault role per event, named exactly as cf-vault creates them. Failing here rather than
      # letting Vault reject the login keeps the reason legible: a dispatch from a feature branch is
      # outside the role's bound subject, which is otherwise an opaque permission-denied.
      - name: Select the Vault role for this event
        id: vault-role
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_ACTION: ${{ github.event.action }}
          DEFAULT_BRANCH_REF: refs/heads/${{ github.event.repository.default_branch }}
          TARGET_REPO: ${{ env.DOCS_REPO }}
        run: |
          set -euo pipefail

          source_name="${GITHUB_REPOSITORY#*/}"
          target_name="${TARGET_REPO#contentful/}"

          if [ "$EVENT_NAME" = 'release' ] && [ "$GITHUB_REF_TYPE" = 'tag' ] && [ "$EVENT_ACTION" = 'published' ]; then
            suffix='release'
          elif [ "$EVENT_NAME" = 'workflow_dispatch' ] && [ "$GITHUB_REF" = "$DEFAULT_BRANCH_REF" ]; then
            suffix='workflow-dispatch'
          else
            echo "No cross-repository write role covers this run ($EVENT_NAME on $GITHUB_REF)." >&2
            echo "Publish a release, or dispatch from $DEFAULT_BRANCH_REF and pass 'ref' to export another tree." >&2
            exit 1
          fi

          printf 'role=%s-github-action-cross-repository-write-%s-%s\n' \
            "$source_name" "$target_name" "$suffix" >>"$GITHUB_OUTPUT"
          printf 'secret=github-cross-repository/token/%s-cross-repository-write-%s\n' \
            "$source_name" "$target_name" >>"$GITHUB_OUTPUT"

      - name: Retrieve a contentful-docs token from Vault
        id: vault
        uses: hashicorp/vault-action@892a26828f195e65540a40b4768ae4571f51ebfc # v4.0.0
        with:
          url: ${{ secrets.VAULT_URL }}
          role: ${{ steps.vault-role.outputs.role }}
          method: jwt
          path: github-actions
          secrets: |
            ${{ steps.vault-role.outputs.secret }} token | GITHUB_TOKEN ;

      # Attributes the sync commit to the App rather than to a shared machine user. The address form
      # is the one GitHub links back to the bot account, so the numeric ID has to be looked up.
      - name: Configure the bot git identity
        env:
          GH_TOKEN: ${{ steps.vault.outputs.GITHUB_TOKEN }}
          BOT_NAME: contentful-cross-repository[bot]
        run: |
          set -euo pipefail
          user_id="$(gh api "/users/$BOT_NAME" --jq .id)"
          git config --global user.name "$BOT_NAME"
          git config --global user.email "$user_id+$BOT_NAME@users.noreply.github.com"

      - name: Checkout contentful-docs
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: ${{ env.DOCS_REPO }}
          path: ${{ env.DOCS_DIR }}
          token: ${{ steps.vault.outputs.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Apply the bundle
        env:
          TARGET_DIR: ${{ env.DOCS_DIR }}
        run: pnpm docs:fern:apply -- --docs-repo "$TARGET_DIR"

      - name: Push the sync branch and upsert the pull request
        working-directory: ${{ env.DOCS_DIR }}
        env:
          GH_TOKEN: ${{ steps.vault.outputs.GITHUB_TOKEN }}
          BRANCH: ${{ steps.resolve.outputs.branch }}
          EXPORT_REF: ${{ steps.resolve.outputs.ref }}
          EXPORT_SHA: ${{ steps.resolve.outputs.sha }}
          SOURCE_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          # Empty on a release, so a release publishes a reviewable pull request rather than a draft.
          DRAFT: ${{ inputs.draft }}
        run: |
          set -euo pipefail

          if [ -z "$(git status --porcelain)" ]; then
            echo "Documentation is already in sync; nothing to push."
            exit 0
          fi

          # Git identity was configured globally as `contentful-cross-repository[bot]` above.
          git checkout -b "$BRANCH"
          git add --all
          git commit --message "docs: sync Optimization SDK documentation from ${EXPORT_REF}" \
            --message "Generated by \`pnpm docs:fern\` from ${SOURCE_REPO}@${EXPORT_SHA}. Do not edit these pages here; edit \`documentation/\` in ${SOURCE_REPO} and re-run the sync."
          # Forced only so that re-running the same commit is idempotent. Every distinct commit gets
          # its own branch, so this never rewrites a branch a reviewer is already reading.
          git push --force origin "$BRANCH"

          body="$(printf 'Automated sync of the Optimization SDK documentation.\n\n- Source: `%s@%s` (ref `%s`)\n- Generated by `pnpm docs:fern`; pages, navigation, and redirects are all generated.\n- Workflow run: %s\n\nThese pages are generated. Prose changes belong in `documentation/` in the source repo, otherwise the next sync overwrites them.\n' "$SOURCE_REPO" "$EXPORT_SHA" "$EXPORT_REF" "$RUN_URL")"

          pr_url="$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [ -n "$pr_url" ]; then
            gh pr edit "$BRANCH" --body "$body"
            echo "Updated the existing pull request for $BRANCH."
          else
            draft_flag=''
            [ "$DRAFT" = 'true' ] && draft_flag='--draft'
            # shellcheck disable=SC2086 # draft_flag is an intentional single optional flag.
            pr_url="$(gh pr create --base main --head "$BRANCH" $draft_flag \
              --title "docs: sync Optimization SDK documentation" \
              --body "$body")"
            echo "Opened $pr_url for $BRANCH."
          fi

          # A sync replaces the whole generated corpus, so two open sync pull requests would only
          # conflict with each other. Close the older ones and delete their branches, which keeps one
          # open pull request without any branch outliving the commit it was generated from.
          gh pr list --state open --limit 100 --json number,headRefName \
            | jq -r --arg prefix "$SYNC_BRANCH_PREFIX" --arg branch "$BRANCH" \
                '.[] | select(.headRefName | startswith($prefix)) | select(.headRefName != $branch) | .number' \
            | while read -r superseded; do
                gh pr close "$superseded" --comment "Superseded by ${pr_url}." --delete-branch
                echo "Closed superseded pull request #$superseded."
              done
