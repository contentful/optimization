name: Release Please

permissions:
  contents: read
  id-token: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Retrieve GitHub release token from Vault
        id: vault
        uses: contentful/vault-github-actions/action@5b8cb32ba4cc671f83bda0371d2d1d1fbc653836 # v1.6.0
        with:
          url: ${{ secrets.VAULT_URL }}
          template-preset: github-release

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - run: pnpm install --prefer-offline --frozen-lockfile

      - name: Create GitHub releases
        run: pnpm release:please -- github-release --repo-url "$GITHUB_REPOSITORY" --target-branch main
        env:
          GITHUB_TOKEN: ${{ steps.vault.outputs.GITHUB_TOKEN }}

      - name: Create or update release PR
        run: pnpm release:please -- release-pr --repo-url "$GITHUB_REPOSITORY" --target-branch main
        env:
          GITHUB_TOKEN: ${{ steps.vault.outputs.GITHUB_TOKEN }}
