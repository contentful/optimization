sharedWorkspaceLockfile: false

allowBuilds:
  sharp: true
  unrs-resolver: true

overrides:
  '@contentful/optimization-api-client': 'file:../../pkgs/contentful-optimization-api-client-local.tgz'
  '@contentful/optimization-core': 'file:../../pkgs/contentful-optimization-core-local.tgz'
  '@contentful/optimization-node': 'file:../../pkgs/contentful-optimization-node-local.tgz'
  '@contentful/optimization-nextjs': 'file:../../pkgs/contentful-optimization-nextjs-local.tgz'
  '@contentful/optimization-web': 'file:../../pkgs/contentful-optimization-web-local.tgz'
  '@contentful/optimization-react-web': 'file:../../pkgs/contentful-optimization-react-web-local.tgz'
  '@contentful/optimization-web-preview-panel': 'file:../../pkgs/contentful-optimization-web-preview-panel-local.tgz'
  # axios 1.21.0 reads Date.now() before fetch(), which Next.js cacheComponents rejects while
  # prerendering routes that fetch CDA entries. Remove once contentful.js or this app avoids it.
  axios: '~1.20.0'
